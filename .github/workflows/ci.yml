name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Build & test lipsync-2d-web
        working-directory: packages/lipsync-2d-web
        run: |
          npm install
          npm run build
          npm test

      - name: Build 2D Character Studio
        working-directory: web
        env:
          VITE_BASE: /lipsync-2d/
        run: |
          npm install
          npm run build
