        <h1>lipsync-2d — Real-Time Multilingual 2D Lip-Sync &amp; Visemes</h1>
        <p>
          <strong>lipsync-2d</strong> (Apache-2.0) is a 6.55 MB FP16 (3.57 MB INT8) causal ONNX model trained exclusively
          on CC0-1.0 and CC-BY-4.0 speech corpora across 7 languages (English, Spanish, French, German, Mandarin, Korean,
          Japanese). It predicts 50 Hz 9-shape Rhubarb cues, 15 Oculus visemes, and continuous mouth curves at ~1.5 ms/frame
          in browser WASM.
        </p>
        <ul>
          <li><strong>Install Python CLI:</strong> <code>pip install "lipsync-2d[onnx]"</code></li>
          <li><strong>Install TypeScript runtime:</strong> <code>npm install lipsync-2d-web</code></li>
          <li><strong>Export formats:</strong> Rhubarb JSON / TSV / XML, Live2D JSON, Godot 4 <code>.tres</code>, Blender 5 <code>.py</code></li>
          <li><strong>Human-labeled TIMIT (90 distinct speakers):</strong> 0.616 Macro-F1 vs Rhubarb v1.14.0 0.432 (+18.4 pts), 25.2 ms vs 44.6 ms onset MAE, 5.7% vs 32.5% silence jaw-flap</li>
